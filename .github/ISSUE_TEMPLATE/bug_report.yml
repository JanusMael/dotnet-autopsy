name: Bug report
description: Something is wrong with an analysis image or a report tool
labels: [bug]
body:
  - type: dropdown
    id: image
    attributes:
      label: Image
      description: Which image is affected?
      options:
        - dotnet-autopsy/sos (core dump)
        - dotnet-autopsy/trace (nettrace)
        - dotnet-autopsy/gcdump (gcdump)
        - dotnet-autopsy-base (shared base)
        - build / CI / scripts (not image-specific)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy dump to repo root
        2. docker compose build ...
        3. Open http://localhost:5550/...
        4. See error / wrong output
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, Docker version, DUMP_ARCH, DOTNET_SDK_IMAGE if overridden.
      placeholder: |
        Host OS: Windows 11 / macOS 15 / Ubuntu 24.04
        Docker: 27.x
        DUMP_ARCH: amd64
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        Paste docker build output, analysis.txt snippets, or status.json —
        **redact any PII, tokens, or sensitive process memory first**.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have redacted any PII / secrets from logs or output above
          required: true
        - label: I have searched existing issues and this is not a duplicate
          required: true
